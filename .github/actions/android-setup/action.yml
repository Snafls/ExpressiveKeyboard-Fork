name: Android setup
description: JDK 17, Gradle, Android NDK и встроенный шрифт Nunito

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android NDK
      shell: bash
      run: |
        SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
        if [ -z "$SDKMANAGER" ]; then
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        fi
        yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
        "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358"

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew

    - name: Download bundled rounded font (Nunito, OFL)
      shell: bash
      run: |
        mkdir -p app/src/main/assets/fonts
        curl -fsSL --retry 3 -o app/src/main/assets/fonts/rounded.ttf \
          "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
          || { echo "::warning::Font download failed, system font will be used"; rm -f app/src/main/assets/fonts/rounded.ttf; }
        ls -la app/src/main/assets/fonts || true
